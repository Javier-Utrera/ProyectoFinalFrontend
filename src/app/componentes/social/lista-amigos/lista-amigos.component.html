<section class="lista-amigos py-5">
  <div class="container">
    <h3 class="section-subtitle mb-4">Amigos</h3>

    @if (cargando) {
    <div class="status-message" role="status">
      <app-libro-carga></app-libro-carga>
      <span class="visually-hidden">Cargando amigos…</span>
    </div>
    } @else if (amigos.length === 0) {
    <div class="status-message" role="alert">
      <p>No tienes amigos todavía.</p>
    </div>
    } @else {
    <ul class="list-group" role="list">
      @for (amigo of amigos; track amigo.id) {
      <li class="list-group-item d-flex align-items-center justify-content-between" role="listitem">
        <div class="d-flex align-items-center gap-3">
          @if (amigo.avatar) {
          <img [src]="amigo.avatar" alt="Avatar de {{ amigo.username }}" class="rounded-circle" width="50"
            height="50" />
          } @else {
          <i class="bi bi-person-circle fs-2 text-muted me-3"></i>
          }
          <div class="user-details">
            <app-user-link [user]="amigo" [linkClass]="'fw-bold text-decoration-none'">
              {{ amigo.username }}
            </app-user-link><br />
            <small class="text-muted">{{ amigo.ciudad }}, {{ amigo.pais }}</small>
          </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="eliminarAmigo(amigo.id)">
          Eliminar
        </button>
      </li>
      }
    </ul>
    }
  </div>
</section>
