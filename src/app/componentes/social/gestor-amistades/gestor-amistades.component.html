<div class="app-gestor-amistades">
  <!-- Botón hamburguesa móvil -->
  <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir menú de pestañas">
    <span [class.open]="menuAbierto"></span>
    <span [class.open]="menuAbierto"></span>
    <span [class.open]="menuAbierto"></span>
  </button>

  <!-- Pestañas de navegación -->
  <ul class="nav nav-tabs mb-4" [class.show]="menuAbierto">
    @for (item of tabs; track item.key) {
      <li
        class="nav-item"
        [class.active-item]="tab === item.key"
      >
        <button
          class="nav-link"
          [class.active]="tab === item.key"
          (click)="seleccionarTab(item.key)"
          type="button"
          [attr.aria-selected]="tab === item.key"
          role="tab"
        >
          {{ item.label }}
        </button>
      </li>
    }
  </ul>

  <!-- Contenido de la pestaña activa -->
  <div class="tab-content" role="tabpanel">
    @switch (tab) {
      @case ('buscar') {
        <div class="tab-pane active">
          <app-buscador-usuarios></app-buscador-usuarios>
        </div>
      }
      @case ('amigos') {
        <div class="tab-pane active">
          <app-lista-amigos></app-lista-amigos>
        </div>
      }
      @case ('recibidas') {
        <div class="tab-pane active">
          <app-solicitudes-recibidas></app-solicitudes-recibidas>
        </div>
      }
      @case ('enviadas') {
        <div class="tab-pane active">
          <app-solicitudes-enviadas></app-solicitudes-enviadas>
        </div>
      }
      @case ('bloqueados') {
        <div class="tab-pane active">
          <app-usuarios-bloqueados></app-usuarios-bloqueados>
        </div>
      }
    }
  </div>
</div>
