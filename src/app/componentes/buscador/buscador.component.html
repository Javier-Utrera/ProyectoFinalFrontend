<form [formGroup]="form" (ngSubmit)="onSubmit()" class="buscar-form">

  <!-- ─── Primera fila: Título, Ordenar y Botones ─────────────────────────────── -->
  <div class="row g-3 align-items-end mb-3">
    <!-- Título -->
    <div class="col-12 col-sm-6 col-md-4">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" id="titulo" formControlName="titulo" class="form-control shadow-sm"
        placeholder="Buscar por título…" autocomplete="off" />
    </div>

    <!-- Ordenar -->
    <div class="col-12 col-sm-6 col-md-4">
      <label for="ordering" class="form-label">Ordenar</label>
      <select id="ordering" formControlName="ordering" class="form-select shadow-sm">
        <option value="-fecha_creacion">Más recientes</option>
        <option value="fecha_creacion">Más antiguos</option>
        <option value="-titulo">Título Z→A</option>
        <option value="titulo">Título A→Z</option>
        <option value="-num_escritores">+ Colaboradores</option>
        <option value="num_escritores">− Colaboradores</option>
      </select>
    </div>

    <!-- Botones Buscar y Toggle Avanzado -->
    <div class="col-12 col-sm-6 col-md-4 d-flex justify-content-start justify-content-md-end gap-2">
      <!-- Botón Buscar -->
      <button type="submit" class="btn btn-primary btn-shadow">
        <i class="bi bi-search me-1"></i>Buscar
      </button>

      <!-- Botón Toggle Avanzado -->
      <button type="button" class="btn btn-outline-secondary btn-shadow" (click)="toggleAdvanced()"
        [attr.aria-expanded]="advancedOpen" aria-controls="advanced-fields-wrapper">
        <i class="bi" [class.bi-filter]="!advancedOpen" [class.bi-chevron-up]="advancedOpen"
          [class.rotate-180]="advancedOpen"></i>
      </button>
    </div>
  </div>

  <!-- ─── Filtros Avanzados (con animación CSS) ──────────────────────────────── -->
  <div id="advanced-fields-wrapper" class="advanced-filters overflow-hidden" [class.open]="advancedOpen">
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-md-4">
        <label for="autor" class="form-label">Autor</label>
        <input type="text" id="autor" formControlName="autor" class="form-control shadow-sm" placeholder="Autor…"
          autocomplete="off" />
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="descripcion" class="form-label">Descripción</label>
        <input type="text" id="descripcion" formControlName="descripcion" class="form-control shadow-sm"
          placeholder="Descripción…" autocomplete="off" />
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="idioma" class="form-label">Idioma</label>
        <select id="idioma" formControlName="idioma" class="form-select shadow-sm">
          <option value="">Todos</option>
          @for (i of idiomas; track i.value) {
          <option [value]="i.value">{{ i.label }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="generos" class="form-label">Género</label>
        <select id="generos" formControlName="generos" class="form-select shadow-sm">
          <option value="">Todos</option>
          @for (g of generos; track g.value) {
          <option [value]="g.value">{{ g.label }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="num_escritores" class="form-label">Colaboradores</label>
        <select id="num_escritores" formControlName="num_escritores" class="form-select shadow-sm">
          <option value="">Cualquiera</option>
          @for (n of numEscritoresOpts; track n) {
          <option [value]="n">{{ n }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="desde" class="form-label">Desde</label>
        <input type="date" id="desde" formControlName="desde" class="form-control shadow-sm" />
      </div>

      <div class="col-12 col-sm-6 col-md-4">
        <label for="hasta" class="form-label">Hasta</label>
        <input type="date" id="hasta" formControlName="hasta" class="form-control shadow-sm" />
      </div>
    </div>
  </div>
</form>
