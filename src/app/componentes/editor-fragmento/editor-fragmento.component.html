@if (cargando) {
<div class="text-center p-4">
  <app-libro-carga></app-libro-carga>
</div>
} @else {
<h3>Fragmento (orden {{ orden }})</h3>

<app-editor [(model)]="contenidoHtml"></app-editor>

<p class="mt-2 text-warning small">
  Una vez marques el fragmento como <strong>"listo"</strong>, no podrás volver a editarlo.
</p>

<div class="mt-3">
  <button class="btn btn-secondary me-2" (click)="guardarBorrador()" [disabled]="listo">
    Guardar borrador
  </button>

  <button class="btn btn-success" (click)="marcarComoListo()" [disabled]="listo">
    Marcar como listo
  </button>

  @if (listo) {
  <span class="text-success ms-3">
    ✔ Listo para publicar
  </span>
  }

</div>
}
