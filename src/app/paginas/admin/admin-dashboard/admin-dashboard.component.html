<div class="dashboard-container">

    <h1 class="text-center mb-4">Panel de Administración</h1>
  
    <!-- 1) Métricas ligeramente más grandes -->
    <div class="metrics-grid mb-5">
      <div *ngFor="let m of metrics" class="metric-square card">
        <div class="card-body text-center p-3">
          <div class="metric-label">{{ m.label }}</div>
          <div class="metric-value">{{ m.value }}</div>
        </div>
      </div>
    </div>
  
    <!-- 2) Doughnuts ampliados en fila -->
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-4">
        <c-card class="h-100">
          <c-card-header class="text-center">Usuarios por Rol</c-card-header>
          <c-card-body class="d-flex justify-content-center align-items-center">
            <canvas baseChart
                    class="chart-circle"
                    [data]="rolesData"
                    [options]="doughnutOptions"
                    type="doughnut">
            </canvas>
          </c-card-body>
        </c-card>
      </div>
      <div class="col-12 col-md-4">
        <c-card class="h-100">
          <c-card-header class="text-center">Relatos por Estado</c-card-header>
          <c-card-body class="d-flex justify-content-center align-items-center">
            <canvas baseChart
                    class="chart-circle"
                    [data]="relatosData"
                    [options]="doughnutOptions"
                    type="doughnut">
            </canvas>
          </c-card-body>
        </c-card>
      </div>
      <div class="col-12 col-md-4">
        <c-card class="h-100">
          <c-card-header class="text-center">Suscripciones</c-card-header>
          <c-card-body class="d-flex justify-content-center align-items-center">
            <canvas baseChart
                    class="chart-circle"
                    [data]="subsData"
                    [options]="doughnutOptions"
                    type="doughnut">
            </canvas>
          </c-card-body>
        </c-card>
      </div>
    </div>
  
    <!-- 3) Línea usuarios -->
    <c-card class="mb-5">
      <c-card-header class="text-center">Usuarios: Total vs Últimos 7d</c-card-header>
      <c-card-body class="d-flex justify-content-center align-items-center">
        <canvas baseChart
                class="chart-line"
                [data]="usersLineData"
                [options]="lineOptions"
                type="line">
        </canvas>
      </c-card-body>
    </c-card>
  
    <!-- 4) Barras Acciones -->
    <c-card class="mb-5">
      <c-card-header class="text-center">Acciones</c-card-header>
      <c-card-body class="d-flex justify-content-center align-items-center">
        <canvas baseChart
                class="chart-bar"
                [data]="accionesBarData"
                [options]="barOptions"
                type="bar">
        </canvas>
      </c-card-body>
    </c-card>
  
    <!-- 5) Ingresos Mes vs Total -->
    <c-card class="mb-5">
      <c-card-header class="text-center">Ingresos: Mes vs Total</c-card-header>
      <c-card-body class="d-flex justify-content-center align-items-center">
        <canvas baseChart
                class="chart-line"
                [data]="revenueLineData"
                [options]="lineOptions"
                type="line">
        </canvas>
      </c-card-body>
    </c-card>
  
    <!-- 6) Radar Resumen -->
    <c-card>
      <c-card-header class="text-center">Resumen Radar</c-card-header>
      <c-card-body class="d-flex justify-content-center align-items-center">
        <canvas baseChart
                class="chart-radar"
                [data]="radarData"
                [options]="radarOptions"
                type="radar">
        </canvas>
      </c-card-body>
    </c-card>
  
  </div>
